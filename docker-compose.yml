services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: consignado-simulator-backend
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      BANK_TIMEOUT_MS: 1800
      BANCO_ALFA_FAILURE_MODE: none
      BANCO_BETA_FAILURE_MODE: none
      AUTH_ADMIN_EMAIL: admin@consignado.local
      AUTH_ADMIN_PASSWORD: altere-esta-senha-em-desenvolvimento
      AUTH_DATA_FILE: /app/data/auth-users.json
    volumes:
      - auth-data:/app/data
    restart: unless-stopped

volumes:
  auth-data:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: consignado-simulator-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3333
    depends_on:
      - backend
    restart: unless-stopped
